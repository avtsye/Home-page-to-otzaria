name: Remove release 4.0.7 (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-release-4.0.7-temp.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub Release v4.0.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v4.0.7 --repo avtsye/Home-page-to-otzaria -y
