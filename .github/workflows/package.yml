name: Package Otzaria plugin

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'main.js'
      - 'manifest.json'
      - 'otzaria-icon.png'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"
      - name: Check JavaScript
        run: node --check main.js
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build package into dist
        shell: bash
        run: |
          mkdir -p dist build
          rm -f "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}.otzplugin"
          zip -9 -j "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}.otzplugin" manifest.json index.html main.js otzaria-icon.png
          cp "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}.otzplugin" build/
      - name: Commit packaged plugin to dist
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}.otzplugin"
          if git diff --cached --quiet; then
            echo "dist already up to date"
          else
            git commit -m "Package plugin ${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: home-page-to-otzaria-${{ steps.version.outputs.version }}
          path: build/*.otzplugin
          if-no-files-found: error
