name: Package Otzaria plugin

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'main.js'
      - 'features.js'
      - 'manifest.json'
      - 'otzaria-icon.png'
      - 'plugin-icon.jpg'
      - 'tests/**'
      - '.github/workflows/package.yml'
  workflow_dispatch:

concurrency:
  group: home-page-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check features.js
          node --check tests/smoke.js
      - name: Run smoke checks
        run: node tests/smoke.js
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build package into dist
        shell: bash
        run: |
          mkdir -p dist build debug-build dev-compat-build
          rm -f "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}.otzplugin" "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}-debug.otzplugin" "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}-dev-compat.otzplugin"
          zip -9 -j "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}.otzplugin" manifest.json index.html main.js features.js otzaria-icon.png plugin-icon.jpg
          cp "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}.otzplugin" build/

          printf "debug" > debug.flag
          cp manifest.json index.html main.js features.js otzaria-icon.png plugin-icon.jpg debug.flag debug-build/
          (cd debug-build && zip -9 "../dist/home-page-to-otzaria-${{ steps.version.outputs.version }}-debug.otzplugin" manifest.json index.html main.js features.js otzaria-icon.png plugin-icon.jpg debug.flag)
          cp "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}-debug.otzplugin" build/

          cp manifest.json index.html main.js features.js otzaria-icon.png plugin-icon.jpg dev-compat-build/
          node -e "const fs=require('fs'); const p='dev-compat-build/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.minAppVersion='0.9.97'; fs.writeFileSync(p,JSON.stringify(m,null,2)+'\\n')"
          (cd dev-compat-build && zip -9 "../dist/home-page-to-otzaria-${{ steps.version.outputs.version }}-dev-compat.otzplugin" manifest.json index.html main.js features.js otzaria-icon.png plugin-icon.jpg)
          cp "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}-dev-compat.otzplugin" build/
      - name: Verify assets are excluded from packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in build/*.otzplugin; do
            echo "Checking $pkg"
            if unzip -l "$pkg" | grep -E '(^|[[:space:]])assets/'; then
              echo "::error::assets/ must not be included in plugin packages"
              exit 1
            fi
          done
          echo "assets/ excluded from all packages"
      - name: Commit packaged plugin to dist
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}.otzplugin" \
                  "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}-debug.otzplugin" \
                  "dist/home-page-to-otzaria-${{ steps.version.outputs.version }}-dev-compat.otzplugin"
          if git diff --cached --quiet; then
            echo "dist already up to date"
          else
            git commit -m "Package plugin ${{ steps.version.outputs.version }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: home-page-to-otzaria-${{ steps.version.outputs.version }}
          path: build/*.otzplugin
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          TITLE="דף הבית לאוצריא $VERSION"
          RELEASE_FILE="build/home-page-to-otzaria-$VERSION.otzplugin"
          DEBUG_ASSET="home-page-to-otzaria-$VERSION-debug.otzplugin"
          DEV_ASSET="home-page-to-otzaria-$VERSION-dev-compat.otzplugin"

          cat > release-notes.md <<EOF
          ## דף הבית לאוצריא $VERSION

          תוסף דף בית מתקדם לאוצריא שמרכז את הדברים השימושיים ביותר במקום אחד, כדי להתחיל לעבוד מהר ונוח יותר.

          ### מה כולל התוסף
          - חיפוש חי בשמות ספרים ובתוך תוכן הספרים.
          - המשך קריאה, היסטוריה וסימניות.
          - מועדפים וקבוצות ספרים, כולל צבעים, אייקונים ותתי־קבוצות.
          - גישה מהירה לכל התוספים המותקנים.
          - פעולות מהירות לספרים, קבוצות ותוספים.
          - התאמה אישית של סדר הכרטיסים, מספר עמודות, צפיפות, רקע, צבע הדגשה ופינות.
          - אפשרות לבחור מה ייפתח בלחיצה על כפתור +: דף הבית, הספרייה או העיון.
          - מצב Focus, קיצורי מקלדת ומסך אבחון מובנה.
          - שליחת משוב ודיווח על תקלות מתוך התוסף.
          - קישורים חיצוניים נפתחים בדפדפן ברירת המחדל של המערכת.

          ### הורדה
          הורידו את **home-page-to-otzaria-$VERSION.otzplugin** והתקינו דרך מנהל התוספים של אוצריא.

          נדרשת **אוצריא 0.9.98 ומעלה**.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving the published release unchanged."
          else
            gh release create "$TAG" \
              "$RELEASE_FILE" \
              --target main \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi
