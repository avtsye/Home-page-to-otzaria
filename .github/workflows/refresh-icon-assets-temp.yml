name: Refresh icon assets (temporary)

on:
  push:
    branches: [main]
    paths:
      - 'assets/.icon-master-temp.webp'
      - '.github/workflows/refresh-icon-assets-temp.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate clear icon assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('assets/.icon-master-temp.webp')
          image = Image.open(src).convert('RGBA')
          for size in (256, 512, 1024, 2048):
              out = Path(f'assets/home-page-icon-{size}.png')
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(out, 'PNG', optimize=True)
              print(out, out.stat().st_size)
          PY

      - name: Commit refreshed icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-page-icon-256.png assets/home-page-icon-512.png assets/home-page-icon-1024.png assets/home-page-icon-2048.png
          if git diff --cached --quiet; then
            echo "No icon changes."
            exit 0
          fi
          git commit -m "Replace icon assets with clearer generated versions [skip ci]"
          git push
